    <!-- SISTEM PROTEKSI PASSWORD - Memblokir sebelum halaman dimuat -->
    <script>
        (function() {
            const passwordBenar = "tasya123"; // Password Anda
            let inputPassword = prompt("Akses Terkunci! Masukkan Password untuk membuka:");
            
            if (inputPassword !== passwordBenar) {
                document.write(`
                    <div style="font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f1f5f9; margin: 0; text-align: center;">
                        <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; width: 90%;">
                            <h2 style="color: #ef4444; margin-bottom: 0.5rem; font-size: 1.5rem;">Akses Ditolak!</h2>
                            <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem;">Password yang Anda masukkan salah atau dibatalkan.</p>
                            <button onclick="location.reload()" style="background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Coba Lagi</button>
                        </div>
                    </div>
                `);
                window.stop();
                throw new Error("Akses ditolak");
            }
        })();
    </script>
